# Replica of orbital nginx/ops-server.conf:826-862 (TLS, regex server_name, no client_max_body_size => 1m default).
pid $SCRATCH/replica/nginx-gl.pid;
error_log $SCRATCH/replica/logs/error-gl.log;
events {}
http {
  access_log $SCRATCH/replica/logs/access-gl.log;
  client_body_temp_path $SCRATCH/replica/tmp; proxy_temp_path $SCRATCH/replica/tmp; fastcgi_temp_path $SCRATCH/replica/tmp; uwsgi_temp_path $SCRATCH/replica/tmp; scgi_temp_path $SCRATCH/replica/tmp;
  server {
    listen 127.0.0.1:18445 ssl;
    server_name ~^(?<app_subdomain>[^.]+)\.staging\.autonomous-enablements\.whydevslovedynatrace\.com$;
    ssl_certificate $SCRATCH/replica/c.pem; ssl_certificate_key $SCRATCH/replica/k.pem;
    client_max_body_size 600m;  # SPIKE FIX 4
    location / {
        rewrite ^/(.*)$ /proxy-subdomain/$1 break;
        proxy_pass         http://127.0.0.1:18082;
        proxy_set_header   Host              $host;
        proxy_set_header   X-App-Subdomain   $app_subdomain;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 60;
    }
  }
}
