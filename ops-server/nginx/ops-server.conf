# Enablement Ops Platform — nginx reverse proxy with GitHub SSO
#
# Auth strategy:
#   /api/auth/role         — opportunistic: forward X-Auth-User if session valid,
#                            fall through to backend (returns guest) when not.
#   write endpoints        — hard-enforce: auth_request must succeed (401 → JSON).
#   everything else        — public pass-through; backend enforces reads itself.

# Content packs are immutable per commit sha and byte-identical for every tenant.
# Cache them at the edge keyed on path+ref (tenant deliberately excluded so 300
# tenants installing the same profile share one cached copy — the FastAPI domain
# gate still runs on every cache MISS). proxy_cache_lock adds nginx-level
# single-flight on top of the app's own build lock.
proxy_cache_path /var/cache/nginx/content-packs levels=1:2 keys_zone=packs:10m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 443 ssl;  # http2 removed: Chrome reuses H2 connections for WebSocket, but nginx 1.24 doesn't support RFC 8441 extended CONNECT, so the WS upgrade fails silently.
    server_name autonomous-enablements.whydevslovedynatrace.com;

    ssl_certificate     /etc/letsencrypt/live/autonomous-enablements.whydevslovedynatrace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autonomous-enablements.whydevslovedynatrace.com/privkey.pem;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── oauth2-proxy public endpoints (sign-in / callback / userinfo) ──────
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Internal subrequest target used by auth_request directives below
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }

    # ── Role detection for /api/auth/role ─────────────────────────────────
    # Opportunistic: forward X-Auth-User when the session is valid; fall
    # through to @auth_role_anonymous (no header → backend returns guest)
    # when the visitor is not signed in.  Never returns 401 to the caller.
    location = /api/auth/role {
        auth_request      /oauth2/auth;
        auth_request_set  $user  $upstream_http_x_auth_request_user;
        auth_request_set  $email $upstream_http_x_auth_request_email;
        error_page 401 = @auth_role_anonymous;

        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated fallback for /api/auth/role — no X-Auth-User sent,
    # backend returns {"role":"guest"}.
    location @auth_role_anonymous {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Write endpoints (require GitHub SSO) ──────────────────────────────
    # All require an authenticated, org-member session.  Unauthenticated
    # requests get a JSON 401 so the frontend can redirect to sign-in.
    # The backend additionally validates writer role and returns 403 for
    # non-members even if they somehow bypass nginx.

    location = /api/builds/trigger {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/builds/trigger-fleet {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-service profile management — org members only (writer). Sets
    # X-Auth-User so content_service.py can authorize. The tenant-facing content
    # endpoints (/api/content/profiles/{id}, /api/content/repos/...) stay on the
    # public catch-all and are gated by X-Content-Key instead.
    location ~ ^/api/content/admin/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Workshops & Delivery admin (dashboard tab) — org members only, HARD gate.
    # Distinct from /api/live/, which is opportunistic because the enablement
    # app calls it with a service bearer and no X-Auth-User. These routes read
    # EVERY tenant's workshops and rosters, so the service bearer must not be
    # enough: only a signed-in org member gets here, and FastAPI re-checks with
    # _require_writer. Never add http2 to this server (WebSocket/RFC 8441).
    location ~ ^/api/workshops/admin/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Token-based deploy/undeploy — NOT org-member-gated: the platform token in the
    # body carries the target tenant's own authority, so a signed-out user with a valid
    # token may deploy/register. Opportunistic auth (mirrors /api/auth/role): forward
    # X-Auth-User when a session is valid (for the audit identity), else fall through to
    # the anonymous proxy. Exact `=` match → takes priority over the regex block below,
    # so /api/deploy/audit, /start, /mint-clients stay hard-gated.
    # Public read: the version Orbital would deploy (origin/master app.config.json). No secret,
    # no tenant credential. The app's in-tenant "Check for updates" button calls this with its
    # service bearer. Exact `=` match takes priority over the `~ ^/api/deploy/` writer regex below.
    location = /api/deploy/latest-version {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # In-app "Update now" trigger (popup target). Public, no auth_request: for COE/SRO Orbital
    # uses its own held creds; for any other tenant it 302s to Dynatrace SSO (the user's own
    # login is the authority). Exact `=` match beats the `~ ^/api/deploy/` writer regex. The
    # COE/SRO path runs dt-app build+deploy inline → long timeout like the token deploy.
    # Step 1 of the in-app "Update now": the app POSTs the pasted platform token; Orbital
    # encrypts + holds it under a nonce for 5 min. Public (opaque blob keyed by the nonce).
    location = /api/deploy/stash {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/deploy/app-start {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Token + OAuth-client deploys carry their own authority (the pasted credential),
    # so both allow signed-out callers (anonymous fallback below). Regex placed BEFORE
    # the generic ^/api/deploy/ block — nginx picks the first matching regex.
    # token-start/token-status are the background variant of token, called by the app's
    # Admin "Update now" — same authority model, so they belong in the same block.
    # `preflight` belongs here, not in the catch-all below: the public tenant checker
    # calls it server-to-server from GKE and has no oauth2-proxy session, so the
    # generic ^/api/deploy/ block would 401 it. Same authority model as the others —
    # the OAuth client in the body IS the account's authority.
    location ~ ^/api/deploy/(token|token-start|token-status/[^/]+|oauth|preflight|preflight-scopes)$ {
        auth_request /oauth2/auth;
        error_page 401 = @deploy_token_anonymous;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Anonymous fallback for the token deploy: clear X-Auth-User so a client can't spoof
    # an identity; backend audits the deploy as "anonymous".
    location @deploy_token_anonymous {
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSO-delegated app deploy — starting a deploy is org-member-only (writer). The
    # /auth/dt-callback target stays on the public catch-all (it carries OAuth state).
    location ~ ^/api/deploy/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # dt-app build+deploy can take minutes — don't let nginx 504 mid-deploy (default 60s).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/sync/run {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/audit/refresh {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/sync/prs/invalidate {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/sync/issues/invalidate {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shell-token endpoint — auth-gated, issues a single-use token used by
    # the WebSocket below.  Kept separate because auth_request is incompatible
    # with WebSocket upgrade proxying (nginx strips Upgrade after subrequest).
    location ~ ^/api/jobs/[^/]+/shell-token$ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket PTY bridge — no auth_request here; auth_request is incompatible
    # with WebSocket (nginx strips Upgrade header after subrequest, causing 404).
    # Authentication is done in FastAPI via the single-use shell token.
    location ~ ^/ws/jobs/[^/]+/shell$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }

    # DELETE /api/queue/clear — writer-only; clears the Redis job queue
    location = /api/queue/clear {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # POST /api/jobs/<id>/terminate — id is variable so use regex match.
    # GET /api/jobs/<id>/restore-log rides the same gate: it is the full
    # transcript of a resume replay, i.e. that training's LAB_SOLUTION commands
    # and their output. Learners must never reach it — they get the sanitized
    # lines in /livelog. Keep it OUT of the unauthenticated ^/api/arena/ block.
    location ~ ^/api/jobs/[^/]+/(terminate|restore-log)$ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All /api/ghpages/* and /api/agent/* endpoints are writer-only
    location ~ ^/api/ghpages/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/agent/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/framework/ {
        auth_request /oauth2/auth;
        error_page 401 = @json_unauthorized;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @json_unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized","sign_in":"/oauth2/sign_in"}';
    }

    # ── Workshop pad SSE streams (EPIC-002) ────────────────────────────────
    # Server-Sent Events must not be buffered (events would sit in nginx's
    # proxy buffer instead of reaching the browser) and need a read timeout
    # longer than the pad's 15 s XREAD/keepalive cycle by a wide margin.
    # HTTP/1.1 + empty Connection header keep the upstream connection open.
    # Auth is the pad session token validated in FastAPI (query param).
    # X-Auth-User is cleared: no auth_request runs here, so a client-supplied
    # header must never reach FastAPI looking nginx-verified.
    location ~ ^/api/live/.*stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3700s;
    }

    # ── Live training sessions (PII-masked for anonymous callers) ──────────
    # Opportunistic auth (the /api/auth/role pattern): a signed-in org member
    # gets X-Auth-User forwarded (FastAPI returns FULL rosters/emails and may
    # write); everyone else falls through to @live_anonymous with the header
    # CLEARED (FastAPI masks emails/tenants and 401s the write endpoints
    # unless the app's service bearer is presented — the Authorization header
    # passes through untouched on both paths). Placed AFTER the stream block
    # so SSE keeps its buffering-off location (first matching regex wins).
    location ~ ^/api/live/ {
        auth_request      /oauth2/auth;
        auth_request_set  $user  $upstream_http_x_auth_request_user;
        auth_request_set  $email $upstream_http_x_auth_request_email;
        error_page 401 = @live_anonymous;

        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # provision-all fans out arena provisions — allow the same headroom
        # the app function has (its own cap is 120s).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location @live_anonymous {
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── Dashboard reads with PII + writer actions without a dedicated block ─
    # Same opportunistic pattern: signed-in members see full learner emails /
    # tenants on the running list + queue and can use rerun / queue-item /
    # EC2 fleet actions; anonymous callers get masked payloads (and 401 on
    # the writer actions) because the header is cleared in the fallback.
    # /api/tenants/* (attribution registry) rides the same block: signed-in
    # members read it in the browser; the app's service bearer passes through
    # the anonymous fallback untouched (Authorization is never stripped).
    #
    # The second half of this regex is the DASHBOARD_ONLY_READS set in app.py —
    # repos/workers/history/sync/nightly/framework. FastAPI 401s those outright
    # for a caller with no identity, so they MUST be routed here rather than to
    # the catch-all: `location /` clears X-Auth-User, which would 401 signed-in
    # org members too. Keep the two lists in step — a path added to the Python
    # regex and not to this one stops working for everybody.
    #
    # `framework/(runs|suites)` is REDUNDANT here and kept only so the two lists
    # read the same: nginx picks the first matching regex location, and
    # `location ~ ^/api/framework/` above already hard-gates the whole prefix
    # (auth_request + @json_unauthorized, X-Auth-User set for members). Verified
    # by replaying the location order against the live conf, 2026-08-17.
    location ~ ^/api/(builds/running|builds/rerun/.+|queue/(list|item)|fleet(/.*)?|tenants(/.*)?|repos|workers|branches/all|builds/history|nightly/[^/]+|sync/(commands|history|status-summary|prs|issues|audit)|framework/(runs|suites))/?$ {
        auth_request      /oauth2/auth;
        auth_request_set  $user  $upstream_http_x_auth_request_user;
        auth_request_set  $email $upstream_http_x_auth_request_email;
        error_page 401 = @dash_anonymous;

        proxy_set_header X-Auth-User  $user;
        proxy_set_header X-Auth-Email $email;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @dash_anonymous {
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Arena API (training sessions, called via the DT app function) ──────
    # Learner-facing checks answer instantly (check* helpers) and never hold
    # this connection. The high ceiling exists for AUTOMATION only: lab-driver
    # and the agentic validator run the same commands with LAB_WAIT=1 (bounded
    # rollout waits) and timeoutSeconds up to Orbital's 900 s exec clamp. The
    # proxy must outlive that cap so the client always receives Orbital's clean
    # JSON result/timeout — never an nginx 504 HTML page.
    location ~ ^/api/arena/ {
        proxy_pass http://127.0.0.1:8080;
        # No auth_request here (public contract for the app function, load
        # bots and nightly) — clear X-Auth-User so a client can't spoof the
        # nginx-verified identity FastAPI uses for unmasked reads.
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 910s;
        proxy_send_timeout 910s;
    }

    # ── GitHub webhook (public — HMAC-signed by GitHub) ────────────────────
    location /webhook {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event      $http_x_github_event;
        proxy_set_header X-GitHub-Delivery   $http_x_github_delivery;
    }

    # ── App proxy — streams k3d app traffic through the dashboard backend ──
    # No auth_request: the backend validates the job_id against Redis and
    # only proxies if a valid app_proxy_port is present for that job.
    # add_header here replaces the server-level X-Frame-Options DENY so the
    # embedded iframe can load app content from the same origin.
    location ~ ^/apps/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     60;
    }

    # ── Self-hosted enablement videos (served to the DT App's <video> player) ──
    # Static files on disk; the app references e.g.
    # /videos/enablement/app/kubernetes-monitoring.mp4. Range requests enabled
    # for seeking. (Lives in the canonical conf so a redeploy can't drop it.)
    location /videos/ {
        alias /home/ops/public_html/videos/;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
        types { video/mp4 mp4; video/webm webm; video/ogg ogv; }
        default_type application/octet-stream;
    }

    # ── Content packs: edge-cached (immutable per sha, shared across tenants) ──
    location /api/content/packs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache            packs;
        proxy_cache_key        "$uri|$arg_ref";
        proxy_cache_valid      200 1h;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 90s;
        proxy_cache_use_stale  updating error timeout;
        add_header X-Pack-Cache $upstream_cache_status;
    }

    # ── Raw content proxy (lab images/files): edge-cached like packs.
    # Cacheable because URLs are sha-pinned (?ref=<sha>) — immutable. Keyed
    # without the tenant param so all tenants share one copy per file@sha.
    location /api/content/repos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache            packs;
        proxy_cache_key        "$uri|$arg_ref";
        proxy_cache_valid      200 1h;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 90s;
        proxy_cache_use_stale  updating error timeout;
        add_header X-Pack-Cache $upstream_cache_status;
    }

    # ── Public: dashboard UI + read-only API ───────────────────────────────
    # X-Auth-User/X-Auth-Email are cleared: no auth_request runs on the
    # catch-all, so client-supplied copies of the identity headers must never
    # reach FastAPI (any endpoint trusting them would otherwise be spoofable).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Auth-User  "";
        proxy_set_header X-Auth-Email "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name autonomous-enablements.whydevslovedynatrace.com;
    return 301 https://$host$request_uri;
}

# ── Wildcard subdomain — direct app access at root path ────────────────────
#
# Serves apps at https://{appname}--{job_slug}.autonomous-enablements.whydevslovedynatrace.com/
# The app runs at root (/) so Next.js and other SPAs resolve asset paths correctly
# without any HTML/CSS rewriting — fixes the image-loading issue with Astroshop.
#
# Prerequisites (one-time setup):
#   1. DNS: add A record  *.autonomous-enablements.whydevslovedynatrace.com → <server-IP>
#              in Google Cloud DNS console (whydevslovedynatrace.com zone)
#   2. TLS:  certbot certonly --manual --preferred-challenges dns \
#              -d "*.autonomous-enablements.whydevslovedynatrace.com" \
#              -d "autonomous-enablements.whydevslovedynatrace.com"
#            (adds wildcard SAN to the existing cert; requires adding a DNS TXT record)
#
server {
    listen 443 ssl;
    # Regex captures the subdomain label (everything before the first dot)
    server_name ~^(?<app_subdomain>[^.]+)\.autonomous-enablements\.whydevslovedynatrace\.com$;

    ssl_certificate     /etc/letsencrypt/live/autonomous-enablements.whydevslovedynatrace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autonomous-enablements.whydevslovedynatrace.com/privkey.pem;

    # Allow embedding in the dashboard iframe.
    #
    # X-Frame-Options MUST NOT be set here. Each app is served from its own
    # subdomain ({app}--{job_id}.autonomous-enablements...), while the dashboard
    # that frames it runs on the apex host. Those are DIFFERENT origins, so
    # "SAMEORIGIN" blocks the very embed this block exists to serve:
    #   Refused to display '...' in a frame because it set 'X-Frame-Options'
    #   to 'sameorigin'.
    # X-Frame-Options has no cross-origin allowlist form (ALLOW-FROM is dead in
    # every modern browser), so the allowlist is expressed with CSP
    # frame-ancestors instead — which browsers honour over XFO when both exist.
    # Upstream apps (astroshop/todoapp) send no framing header of their own, so
    # this block is the only place that decides who may frame them.
    add_header Content-Security-Policy "frame-ancestors 'self' https://autonomous-enablements.whydevslovedynatrace.com https://*.autonomous-enablements.whydevslovedynatrace.com" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        # Rewrite to the FastAPI subdomain proxy handler, preserving the full path
        rewrite ^/(.*)$ /proxy-subdomain/$1 break;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-App-Subdomain   $app_subdomain;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 60;
    }
}

# HTTP → HTTPS redirect for wildcard subdomains
server {
    listen 80;
    server_name ~^[^.]+\.autonomous-enablements\.whydevslovedynatrace\.com$;
    return 301 https://$host$request_uri;
}
