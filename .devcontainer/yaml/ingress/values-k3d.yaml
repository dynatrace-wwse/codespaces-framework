# ingress-nginx Helm values — k3d (and any cluster with a real LoadBalancer).
#
# Replaces the static deploy/static/provider/cloud/deploy.yaml manifest.
# Chart defaults already match that provider (controller Service type
# LoadBalancer, which k3d's klipper-lb fronts on the host ports the cluster was
# created with), so the ONLY deliberate change is disabling the admission
# webhook below.

controller:
  # The admission webhook is the single biggest cost of starting this
  # controller, and it buys nothing here.
  #
  # What it does: intercepts CREATE/UPDATE of networking.k8s.io/v1 Ingress and
  # runs `nginx -t` on the would-be config, rejecting bad YAML at admission
  # time. Routing is done by the controller watching Ingress objects and is
  # completely unaffected by this setting.
  #
  # What it costs: two kube-webhook-certgen Jobs must run and write the
  # `ingress-nginx-admission` secret BEFORE the controller pod can start,
  # because the pod mounts that secret with `optional: false`. Measured on a
  # 4-core Codespace: 106s for the certgen Jobs, then ~45s of kubelet mount
  # backoff, and only THEN does the controller image start pulling — around
  # 150s of a ~250s startup, plus a second image to pull.
  #
  # Why it is safe to disable here: every Ingress in this framework is
  # generated by registerApp / registerMkdocs / registerAstroshopIngress from
  # fixed templates. There is no learner-supplied YAML and no
  # configuration-snippet annotation, so the webhook validates input that
  # cannot be malformed. Disabling it also removes the IngressNightmare
  # (CVE-2025-1974) attack surface — that was the upstream mitigation.
  #
  # Trade-off accepted: a genuinely malformed Ingress is now accepted by the
  # API server and skipped by the controller (with an error in its log)
  # instead of being rejected up front.
  admissionWebhooks:
    enabled: false
