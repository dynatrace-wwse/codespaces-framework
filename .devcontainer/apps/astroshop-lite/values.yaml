# AstroShop Lite — framework overrides for the vendored chart (./chart).
#
# Images are Henrik Rexed's public multi-arch builds (amd64 + arm64), pinned by tag AND
# OCI index digest so a re-pushed tag can never change what a training deploys.
# Bump: resolve the new index digest (`docker buildx imagetools inspect <ref>`), re-scan
# with Trivy, update both fields together.
#
# Telemetry: the chart's own collector (debug exporter only) is OFF. Services send OTLP
# gRPC to `otlp.endpoint`, which deployAstroshopLite sets — to the framework's Dynatrace
# collector (deployOtelCollector) by default, or to ASTROSHOP_LITE_OTLP_ENDPOINT.
collector:
  enabled: false

metrics:
  aggregation: delta   # Dynatrace ingests delta temporality

postgres:
  image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
valkey:
  image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a

images:
  frontend:
    repository: ghcr.io/henrikrexed/opentelemetry-demo-light/frontend
    tag: "0.0.16@sha256:d2879c3ba486dc4ae7d3e57c0f463b75b2ec91bb3285f3f09efafd5b0aeae3d5"
  productCatalog:
