# AstroShop Lite — framework overrides for the vendored chart (./chart).
#
# Images are built and published by dynatrace-wwse/astroshop-lite (release.yml, on a v* tag),
# multi-arch (amd64 + arm64), pinned by tag AND OCI index digest so a re-pushed tag can never change what a training deploys.
# Bump: resolve the new index digest (`docker buildx imagetools inspect <ref>`), re-scan
# with Trivy, update both fields together.
#
# Telemetry: the chart's own collector (debug exporter only) is OFF. Services send OTLP
# gRPC to `otlp.endpoint`, which deployAstroshopLite sets — to the framework's Dynatrace
# collector (deployOtelCollector) by default, or to ASTROSHOP_LITE_OTLP_ENDPOINT.
collector:
  enabled: false

metrics:
  aggregation: delta   # Dynatrace ingests delta temporality

postgres:
  image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
valkey:
  image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a

images:
  frontend:
    repository: ghcr.io/dynatrace-wwse/astroshop-lite/frontend
    tag: "0.2.0@sha256:43baf4b583e201e429b0bf7ebaa5a19f754e61c689947655081a38717a458df4"
  productCatalog:
    repository: ghcr.io/dynatrace-wwse/astroshop-lite/product-catalog
    tag: "0.2.0@sha256:d505c82022511c891ef8f2c96328c91483e6bec32e20dd31406b1726577395f2"
  cart:
    repository: ghcr.io/dynatrace-wwse/astroshop-lite/cart
    tag: "0.2.0@sha256:7d7364cc1b6164d6649d86ddcebad532f0a716854311dfe59d8a051f2dcb492f"
  checkout:
    repository: ghcr.io/dynatrace-wwse/astroshop-lite/checkout
    tag: "0.2.0@sha256:272fe6d06fa0c5d28d755c22f775bb0b6ca779bdef3d31d986edc8172da6fb01"
  payment:
    repository: ghcr.io/dynatrace-wwse/astroshop-lite/payment
    tag: "0.2.0@sha256:09dbdf0e087226daefd17506e1624b44df072ef4bb4cea27d9fbb8614ae0db8d"
