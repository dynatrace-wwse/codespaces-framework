# Framework-owned MkDocs base configuration
# Per-repo mkdocs.yaml uses: INHERIT: mkdocs-base.yaml
# This file is fetched by CI at the repo's FRAMEWORK_VERSION tag.
# Local preview: inside the dev container, `installMkdocs` calls `fetchMkdocsBase`,
# which downloads this file when a repo inherits it and does not have it yet.
# There is no `make docs` target -- this comment used to promise one that was
# never written. See docs/framework.md, "Live documentation, locally".

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://cdn.bfldr.com/B686QPH3/at/w5hnjzb32k5wcrcxnwcx4ckg/Dynatrace_signet_RGB_HTML.svg?auto=webp&format=pngg
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share

  font:
    text: Inter
    code: JetBrains Mono

  palette:
  # Dark mode — shown first (default for most modern systems)
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to light mode

  # Light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to dark mode

markdown_extensions:
  - toc:
      permalink: '#'
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid blocks render as diagrams instead of a grey code box.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs"]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_css:
  - stylesheets/extra.css

# Mermaid is vendored, not fetched from a CDN at page load.
# Pinned: mermaid 11.17.2
#   source: https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js
#   sha256: 581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8
# Material's own loader is guarded on `typeof mermaid == "undefined"`, so loading
# our copy here stops it fetching https://unpkg.com/mermaid@11/dist/mermaid.min.js.
# Bumping the pin is a deliberate, documented step -- see docs/versioning.md.
extra_javascript:
  - javascripts/mermaid.min.js

plugins:
  - search
