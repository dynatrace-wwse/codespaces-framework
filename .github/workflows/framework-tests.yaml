name: Framework Unit Tests
on:
  push:
    branches: [main]
    paths:
      # These must match where the framework actually keeps its shell sources.
      # They previously read 'functions.sh' / 'my_functions.sh', which exist at
      # no path in this repo (they live under .devcontainer/util/), so the only
      # trigger that ever fired was the nightly cron — a greeting.sh regression
      # merged green in #156 and went unnoticed for a day.
      - '.devcontainer/util/**'
      - '.devcontainer/test/unit/**'
      - '.github/workflows/framework-tests.yaml'
  pull_request:
    branches: [main]
    paths:
      # These must match where the framework actually keeps its shell sources.
      # They previously read 'functions.sh' / 'my_functions.sh', which exist at
      # no path in this repo (they live under .devcontainer/util/), so the only
      # trigger that ever fired was the nightly cron — a greeting.sh regression
      # merged green in #156 and went unnoticed for a day.
      - '.devcontainer/util/**'
      - '.devcontainer/test/unit/**'
      - '.github/workflows/framework-tests.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  bats:
    name: Bats unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        # zsh: the learner's shell. Without it the zsh test in
        # test_dtctl_monaco.bats skips, and zsh's no-word-splitting is unguarded.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats zsh

      - name: Run framework unit tests
        # Non-root on purpose: the sudo -n and read-only-config tests in
        # test_dtctl_monaco.bats skip as root (root writes anywhere), and a
        # skipped guard looks exactly like a passing one.
        run: |
          set -o pipefail
          [ "$(id -u)" -ne 0 ] || { echo "::error::unit tests must run as a non-root user"; exit 1; }
          bats .devcontainer/test/unit/ --tap | tee "$RUNNER_TEMP/bats.tap"

      - name: No unit test may skip in CI
        # zsh and a non-root user are both provided above, so nothing has a
        # reason to skip here. A skip is a guard that did not run.
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/bats.tap"; then
            echo "::error::the tests above were skipped in CI"; exit 1
          fi
          echo "no skipped tests"
