name: deploy mkdocs to github pages (reusable)
# DORMANT. Nothing calls this workflow, and nothing ever has.
#
#   gh api search/code -f q='"deploy-ghpages-reusable" org:dynatrace-wwse'  -> 0
#   gh run list --workflow=deploy-ghpages-reusable.yaml                     -> no runs
#
# It was added when the plan was to move the 24 consuming repos onto reusable
# workflows; that follow-up never happened, and the same fate met
# integration-tests-reusable.yaml. Last touched 2026-04-08 (41c7d15).
#
# It is kept, not deleted, because it is the only place that expresses the
# tag-qualified fetch (refs/tags/<version>) that the live per-repo workflow does
# not use -- the live one interpolates FRAMEWORK_VERSION into the raw URL bare,
# which resolves a branch or a SHA just as readily as a tag.
#
# Do not revive it as it stands: it is not contract-complete. It fetches
# mkdocs-base.yaml and docs/overrides/main.html, but NOT docs/stylesheets/extra.css
# and NOT docs/javascripts/mermaid.min.js, both of which mkdocs-base.yaml
# references. Measured on mkdocs-material 9.5.42, a build with both of those
# missing exits 0 with zero warnings even under --strict, and ships <link> and
# <script> tags pointing at 404s. The live per-repo workflow generated by
# `sync migrate` fetches all of them and fails loudly when it cannot.
#
# Reviving it therefore means adding those two fetch steps first. Deleting it
# instead is a reasonable call and an open question -- see the PR that added
# this comment.
on:
  workflow_call:
    inputs:
      framework_version:
        description: 'Framework version tag to fetch mkdocs-base.yaml from'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy-github-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch framework mkdocs-base.yaml
        run: |
          curl -fsS "https://raw.githubusercontent.com/dynatrace-wwse/codespaces-framework/refs/tags/${{ inputs.framework_version }}/mkdocs-base.yaml" \
            -o mkdocs-base.yaml || {
            echo "❌ Failed to fetch mkdocs-base.yaml @ ${{ inputs.framework_version }}"
            exit 1
          }

      - name: Fetch framework overrides/main.html
        run: |
          mkdir -p docs/overrides
          curl -fsS "https://raw.githubusercontent.com/dynatrace-wwse/codespaces-framework/refs/tags/${{ inputs.framework_version }}/docs/overrides/main.html" \
            -o docs/overrides/main.html || {
            echo "❌ Failed to fetch overrides/main.html @ ${{ inputs.framework_version }}"
            exit 1
          }

      - name: Install MkDocs Material
        run: pip install --break-system-packages mkdocs-material

      - name: Build and deploy
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          mkdocs build --strict
          mkdocs gh-deploy --force
